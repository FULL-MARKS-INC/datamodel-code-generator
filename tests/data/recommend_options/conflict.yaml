openapi: 3.0.3
info:
  title: Playlist API
  version: 1.0.0
paths: {}
components:
  schemas:
    Track:
      type: object
      properties:
        type:
          type: string
          enum: [track]
        rating:
          type: integer
          enum: [1, 2, 3, null]
    Episode:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [episode]
    Queue:
      type: object
      properties:
        current:
          oneOf:
            - $ref: '#/components/schemas/Track'
            - $ref: '#/components/schemas/Episode'
          discriminator:
            propertyName: type
