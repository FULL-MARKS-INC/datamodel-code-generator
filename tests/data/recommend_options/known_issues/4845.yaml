info: {title: allOf property, version: "1"}
paths: {}
components:
  schemas:
    Issue:
      type: object
      properties:
        id: {type: integer}
    IssueClosed:
      type: object
      properties:
        issue:
          allOf:
            - $ref: '#/components/schemas/Issue'
            - type: object
              properties:
                state: {type: string}
        label:
          type: object
          properties:
            name: {type: string}
    IssueOpened:
      type: object
      properties:
        issue:
          allOf:
            - $ref: '#/components/schemas/Issue'
            - type: object
              properties:
                locked: {type: boolean}
