openapi: 3.1.0
info: {title: distribution, version: "1"}
paths: {}
components:
  schemas:
    Envelope:
      type: object
      required: [id]
      properties:
        id: {type: string}
    Event:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - oneOf:
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [created]}
                name: {type: string}
            - type: object
              required: [type]
              properties:
                type: {type: string, enum: [deleted]}
                reason: {type: string}
