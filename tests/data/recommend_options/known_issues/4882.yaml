openapi: 3.0.3
info: {title: t, version: '1'}
paths: {}
components:
  schemas:
    Track:
      type: object
      properties:
        type: {type: string, enum: [track]}
        name: {type: string}
    Episode:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [episode]}
        show: {type: string}
    Queue:
      type: object
      properties:
        current:
          oneOf:
            - $ref: '#/components/schemas/Track'
            - $ref: '#/components/schemas/Episode'
          discriminator: {propertyName: type}
